<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{% if product %}Edit Product{% else %}Create Product{% endif %}</h1>
        <form method="POST" action="{{ url_for('save_product', product_id=product.id if product else None) }}">
            <label for="name">Product Name:</label>
            <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required>
            
            <label for="feature_name">Feature Name:</label>
            <input type="text" id="feature_name" name="feature_name" value="{{ product.feature_name if product else '' }}">
            
            <label for="description">Description:</label>
            <textarea id="description" name="description">{{ product.description if product else '' }}</textarea>
            
            <label for="barcode">Barcode:</label>
            <input type="text" id="barcode" name="barcode" value="{{ product.barcode if product else '' }}" required>
            
            <label for="picture">Picture:</label>
            <input type="text" id="picture" name="picture" value="{{ product.picture if product else '' }}">
            
            <label for="fabric_cost">Fabric Cost:</label>
            <input type="number" id="fabric_cost" name="fabric_cost" value="{{ product.fabric_cost if product else '' }}" required>
            
            <label for="active">Active:</label>
            <input type="checkbox" id="active" name="active" {% if product.active %}checked{% endif %}>
            
            <button type="submit">Save</button>
        </form>
    </div>
</body>
</html>
